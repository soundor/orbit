name: Release

# Releases Orbit with release-please. Conventional commits on main keep a
# release pull request open with the next version (apps/plugin/package.json,
# which the plugin reports) and apps/plugin/CHANGELOG.md. Only commits that
# touch apps/plugin release; the website deploys by hand between releases.
# Merging it runs, from the merge:
#
#   release-please  tag vX.Y.Z and create its GitHub release as a draft
#   check           format, lint, types and tests of the tagged commit
#   build           the release VST3 per platform, zipped; Linux also runs
#                   the Debug VST3 in the VST3 host
#   publish         upload the zips, SHA256SUMS and their provenance to the
#                   draft, then publish it: published releases are immutable,
#                   so nothing is added after
#   website         deploy orbit.soundor.dev from the tag (website.yml)
#
# A failed run leaves the draft unpublished; rerun its failed jobs. A run
# that never got past release-please finishes by hand from main, for the
# draft's tag (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f tag=vX.Y.Z`); it refuses a release that is
# already published, since published releases cannot take assets.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of a draft release to finish, such as v1.2.3
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # The action names a package's outputs after its path, apps/plugin--…;
    # unprefixed ones exist only for a package at the root.
    outputs:
      created: ${{ steps.release.outputs['apps/plugin--release_created'] || steps.draft.outputs.created }}
      tag: ${{ steps.release.outputs['apps/plugin--tag_name'] || steps.draft.outputs.tag }}
    steps:
      - id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request GITHUB_TOKEN opens starts no workflows, so Verify
          # would not run on the release PR; a token of a user or app does.
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: draft
        name: Find the draft release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$TAG is published already; a published release cannot change"
            exit 1
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache: false
      # The website's build screenshots the web demo in Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter orbit-website exec playwright install --with-deps chromium
      - run: pnpm check

  build:
    name: Build (${{ matrix.platform }})
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: windows-x64, os: windows-2025 }
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/setup
        with:
          cache: false
      - id: vst3
        uses: ./.github/actions/vst3
        with:
          platform: ${{ matrix.platform }}
      - uses: ./.github/actions/pluginval
        with:
          plugin: apps/plugin/.soundor/dist/vst3/Soundor Orbit.vst3
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1200x24" pnpm --filter orbit test:vst3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vst3-${{ matrix.platform }}
          path: ${{ steps.vst3.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [release-please, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vst3-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum Soundor-Orbit-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Upload to the draft release
        working-directory: ${{ runner.temp }}/release
        run: gh release upload "$TAG" Soundor-Orbit-*.zip SHA256SUMS --clobber
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  website:
    name: Website
    needs: [release-please, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      cache: false
      ref: ${{ needs.release-please.outputs.tag }}
