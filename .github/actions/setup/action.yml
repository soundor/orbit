name: Set up Node, pnpm and Rust
description: Install the locked dependencies, and Rust for Orbit's crate (lib/)

inputs:
  cache:
    description: Whether to cache the pnpm store
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    # lib/ compiles natively for the VST3 and to WebAssembly for the web build.
    - shell: bash
      run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
    - shell: bash
      run: corepack enable && corepack install
    - id: store
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - shell: bash
      run: pnpm install --frozen-lockfile
