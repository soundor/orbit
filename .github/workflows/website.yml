name: Website

# orbit.soundor.dev: website/ (the page, and /embed/, Orbit's web build),
# deployed to GitHub Pages.
#
# Release calls it once the release is published, with its tag, so the
# download links name files that exist; run it by hand to deploy a
# website-only change between releases (Actions → Website → Run workflow, or
# `gh workflow run website.yml -f ref=main`). main's package.json names the
# last release until the next release PR merges.

on:
  workflow_call:
    inputs:
      cache:
        description: Cache the pnpm store (disabled by Release)
        type: boolean
        default: true
      ref:
        description: The commit to build the site from
        type: string
        required: true
  workflow_dispatch:
    inputs:
      cache:
        description: Cache the pnpm store
        type: boolean
        default: true
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: main

# One deploy at a time; a newer one waits rather than cancelling.
concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache }}
      - run: pnpm --filter orbit-website build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
