name: Website

# orbit.soundor.dev: apps/website (Fumadocs on TanStack Start, prerendered:
# the landing page, the docs, the changelog, and /embed/, Orbit's web build),
# deployed to GitHub Pages.
#
# Release calls it once the release is published, with its tag, so the
# download links name files that exist; run it by hand to deploy a
# website-only change between releases (Actions → Website → Run workflow, or
# `gh workflow run website.yml -f ref=main`). main's apps/plugin/package.json
# names the last release until the next release PR merges.

on:
  workflow_call:
    inputs:
      cache:
        description: Cache the pnpm store (disabled by Release)
        type: boolean
        default: true
      ref:
        description: The commit to build the site from
        type: string
        required: true
  workflow_dispatch:
    inputs:
      cache:
        description: Cache the pnpm store
        type: boolean
        default: true
      ref:
        description: Branch, tag or commit to deploy
        type: string
        default: main

# One deploy at a time; a newer one waits rather than cancelling.
concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
    steps:
      # The site carries Umami's tracker only when the build has a website
      # ID: the organization's UMAMI_WEBSITE_ID variable. Without it a deploy
      # would publish the site without analytics, so it stops here.
      - name: Check the analytics configuration
        run: |
          if [ -z "$UMAMI_WEBSITE_ID" ]; then
            echo "::error title=UMAMI_WEBSITE_ID is missing::The organization's Actions variable UMAMI_WEBSITE_ID is not set, or not visible to this repository (Organization settings → Secrets and variables → Actions → Variables). The website is not deployed without it."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          cache: ${{ inputs.cache }}
      # The website's build screenshots the web demo in Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter orbit-website exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=orbit-website
      - name: Check the tracker is in the site
        run: |
          if ! grep -q "data-website-id=\"$UMAMI_WEBSITE_ID\"" apps/website/dist/client/index.html; then
            echo "::error title=No analytics tracker::apps/website/dist/client/index.html has no tracker with UMAMI_WEBSITE_ID's website ID."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist/client

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
